[project]
name = "startgg-mcp"
version = "0.1.0"
description = "Read-only MCP server for start.gg fighting game tournament data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.114",
    "mcp[cli]>=2.3.0",
    "psycopg[binary,pool]>=3.3.6",
]

[project.scripts]
startgg-mcp = "startgg_mcp.stdio:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
